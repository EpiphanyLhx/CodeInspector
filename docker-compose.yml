version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: code-inspector-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: code_inspector
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - code-inspector-net

  redis:
    image: redis:7-alpine
    container_name: code-inspector-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - code-inspector-net

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: code-inspector-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - code-inspector-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: code-inspector-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/code_inspector?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
    ports:
      - "8088:8088"
    networks:
      - code-inspector-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: code-inspector-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - code-inspector-net

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  code-inspector-net:
    driver: bridge
